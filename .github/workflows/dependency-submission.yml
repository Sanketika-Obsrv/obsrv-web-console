name: Dependency Submission

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Submit Dependency Graph
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.3
        with:
          filePath: "."
          detectorArgs: "NpmLockfile3=EnableIfDefaultOff"
